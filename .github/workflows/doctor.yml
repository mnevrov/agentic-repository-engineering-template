name: Repository Doctor

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository skeleton
        run: ./scripts/repo-doctor
      - name: Validate telemetry
        run: python3 scripts/validate-telemetry.py
      - name: Enforce append-only telemetry
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            python3 scripts/check-telemetry-append-only.py --base-ref "origin/${{ github.base_ref }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            python3 scripts/check-telemetry-append-only.py --base-ref "${{ github.event.before }}"
          fi
      - name: Test template tooling
        run: make test-template
      - name: Project checks
        run: make check
      - name: Project tests
        run: make test
