name: Repository Doctor

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      - name: Verify exact checkout
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            EXPECTED="${{ github.event.pull_request.head.sha }}"
          else
            EXPECTED="${{ github.sha }}"
          fi
          ACTUAL="$(git rev-parse HEAD)"
          printf 'expected HEAD: %s\nactual HEAD:   %s\n' "$EXPECTED" "$ACTUAL"
          [[ "$ACTUAL" == "$EXPECTED" ]]
      - name: Check repository skeleton
        run: ./scripts/repo-doctor --template
      - name: Validate telemetry
        run: python3 scripts/validate-telemetry.py
      - name: Enforce telemetry contract
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            git fetch --no-tags origin "${{ github.base_ref }}:refs/remotes/origin/${{ github.base_ref }}"
            BASE_REF="origin/${{ github.base_ref }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF=""
          fi
          if [[ -n "$BASE_REF" ]]; then
            python3 scripts/check-telemetry-append-only.py --base-ref "$BASE_REF"
            python3 scripts/check-telemetry-required.py --base-ref "$BASE_REF"
          fi
      - name: Test template tooling
        run: make test-template
      - name: Project checks and tests
        shell: bash
        run: |
          if [[ "${{ github.repository }}" == "mnevrov/agentic-repository-engineering-template" ]]; then
            set +e
            CHECK_OUTPUT="$(make check 2>&1)"; CHECK_RC=$?
            TEST_OUTPUT="$(make test 2>&1)"; TEST_RC=$?
            set -e
            printf '%s\n' "$CHECK_OUTPUT"
            printf '%s\n' "$TEST_OUTPUT"
            [[ $CHECK_RC -eq 2 && "$CHECK_OUTPUT" == *"NOT CONFIGURED"* ]]
            [[ $TEST_RC -eq 2 && "$TEST_OUTPUT" == *"NOT CONFIGURED"* ]]
          else
            make check
            make test
          fi
      - name: Downstream greenfield bootstrap smoke (template repository only)
        if: github.repository == 'mnevrov/agentic-repository-engineering-template'
        shell: bash
        run: |
          set -euo pipefail
          work="$(mktemp -d)"
          trap 'rm -rf "$work"' EXIT
          cp -a . "$work/project"
          rm -rf "$work/project/.git"
          git -C "$work/project" init -q
          git -C "$work/project" config user.email "ci@example.invalid"
          git -C "$work/project" config user.name "CI"
          git -C "$work/project" add .
          git -C "$work/project" commit -qm "Created from template"
          (
            cd "$work/project"
            python3 scripts/init-project "CI downstream"
            ./scripts/repo-doctor --template
            make test-template
            python3 scripts/validate-telemetry.py
            test -f docs/tasks/PROJECT-BOOTSTRAP.md
            test ! -e docs/tasks/EXAMPLE-1.md
            test ! -e docs/reviews/TEMPLATE-7-review.md
            test ! -s .ai/telemetry/cycles.jsonl
            # First project commit exercises BOTH telemetry checks against
            # the inherited source-template baseline. This is CI-only smoke.
            started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
            python3 scripts/record-cycle.py \
              --task PROJECT-BOOTSTRAP \
              --started "$started" \
              --ended "$started" \
              --result partial \
              --evidence docs/tasks/PROJECT-BOOTSTRAP.md \
              --notes "CI-only bootstrap cutover test; not real project gates"
            git add .
            git commit -qm "CI bootstrap telemetry cutover"
            python3 scripts/check-telemetry-append-only.py --base-ref HEAD^
            python3 scripts/check-telemetry-required.py --base-ref HEAD^
            if python3 scripts/init-project "CI downstream"; then
              echo "ERROR: destructive repeat init unexpectedly succeeded" >&2
              exit 1
            fi
          )

  opencode_v2_config:
    name: OpenCode v${{ matrix.opencode_version }} configuration
    strategy:
      fail-fast: false
      matrix:
        opencode_version: ["2.1.2", "2.2.5"]
    if: github.repository == 'mnevrov/agentic-repository-engineering-template'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned OpenCode v2
        run: npm install --global --allow-scripts=@opencode/cli @opencode/cli@${{ matrix.opencode_version }}
      - name: Parse native configuration and discover agents (supported CLI)
        if: matrix.opencode_version == '2.2.5'
        shell: bash
        run: |
          set -euo pipefail
          opencode --version
          python3 scripts/opencode-acceptance.py
      - name: Ensure v2.1.2 is rejected as unsupported (negative compatibility test)
        if: matrix.opencode_version == '2.1.2'
        shell: bash
        run: |
          set -euo pipefail
          opencode --version
          if python3 scripts/opencode-acceptance.py > /tmp/rejected-cli.log; then
            echo "ERROR: known-incompatible CLI unexpectedly accepted" >&2
            exit 1
          fi
          grep -q 'v2.2.5 or newer required' /tmp/rejected-cli.log
          echo "PASS: OpenCode v2.1.2 correctly rejected by acceptance contract"
