name: Repository Doctor

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check repository skeleton
        run: ./scripts/repo-doctor
      - name: Validate telemetry
        run: python3 scripts/validate-telemetry.py
      - name: Enforce telemetry contract
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            BASE_REF="origin/${{ github.base_ref }}"
          elif [[ -n "${{ github.event.before }}" && "${{ github.event.before }}" != "0000000000000000000000000000000000000000" ]]; then
            BASE_REF="${{ github.event.before }}"
          else
            BASE_REF=""
          fi
          if [[ -n "$BASE_REF" ]]; then
            python3 scripts/check-telemetry-append-only.py --base-ref "$BASE_REF"
            python3 scripts/check-telemetry-required.py --base-ref "$BASE_REF"
          fi
      - name: Test template tooling
        run: make test-template
      - name: Project checks and tests
        shell: bash
        run: |
          if [[ "${{ github.repository }}" == "mnevrov/agentic-repository-engineering-template" ]]; then
            set +e
            CHECK_OUTPUT="$(make check 2>&1)"; CHECK_RC=$?
            TEST_OUTPUT="$(make test 2>&1)"; TEST_RC=$?
            set -e
            printf '%s\n' "$CHECK_OUTPUT"
            printf '%s\n' "$TEST_OUTPUT"
            [[ $CHECK_RC -eq 2 && "$CHECK_OUTPUT" == *"NOT CONFIGURED"* ]]
            [[ $TEST_RC -eq 2 && "$TEST_OUTPUT" == *"NOT CONFIGURED"* ]]
          else
            make check
            make test
          fi
